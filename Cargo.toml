[package]
name = "nanokvm-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native Linux NanoKVM USB viewer with GPU video color controls"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui-wgpu = "0.31.1"
egui-winit = { version = "=0.31.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
jpeg-decoder = "0.3.1"
serialport = { version = "4.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
v4l = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
